<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cuk-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#cuk-gradient)" stroke-width="24" filter="url(#shadow)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#1e3a8a" stroke-width="8" opacity="0.3" />
  
  <text x="200" y="180" font-family="Arial, sans-serif" font-weight="900" font-size="90" fill="url(#cuk-gradient)" text-anchor="middle" filter="url(#shadow)">CUK</text>
  <text x="200" y="240" font-family="Georgia, serif" font-weight="bold" font-size="40" fill="#1e3a8a" text-anchor="middle" letter-spacing="4">KERALA</text>
  
  <path d="M 120 280 Q 200 320 280 280" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" />
</svg>
